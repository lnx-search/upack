name: Test

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'README.md'

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Default features + native CPU: exercises the AVX2/AVX-512 backend on
          # x86 and the NEON backend on macOS aarch64.
          - { runner: ubuntu-latest, args: "--workspace" }
          - { runner: macos-latest, args: "--workspace" }
          # No default features: forces the scalar fallback backend, which the
          # runtime dispatch otherwise hides on any SIMD-capable runner.
          - { runner: ubuntu-latest, args: "-p upack --no-default-features" }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      discussions: write
    steps:
      - uses: actions/checkout@v4

      - uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Run tests
        env:
          CARGO_TERM_COLOR: always
        run: RUSTFLAGS="-C target-cpu=native" cargo nextest run --no-fail-fast ${{ matrix.args }}
